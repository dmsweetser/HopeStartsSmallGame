<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Hope Starts Small — Chapter 1: Seeds</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="console">
    <div id="screen">
      <canvas id="game" width="160" height="144"></canvas>
      <a id="audibleBtn" href="https://www.audible.com/pd/Hope-Starts-Small-Audiobook/B0DZPCHT4M" target="_blank" rel="noopener" hidden>&#9834; LISTEN ON AUDIBLE</a>
    </div>
    <div id="deck" hidden>
      <div id="dpad">
        <button id="dpUp" class="dbtn up" type="button" aria-label="D-pad up">&#9650;</button>
        <button id="dpLeft" class="dbtn left" type="button" aria-label="D-pad left">&#9664;</button>
        <span class="dhub"></span>
        <button id="dpRight" class="dbtn right" type="button" aria-label="D-pad right">&#9654;</button>
        <button id="dpDown" class="dbtn down" type="button" aria-label="D-pad down">&#9660;</button>
      </div>
      <button id="btnMenu" type="button" aria-label="Menu">MENU</button>
      <div id="touchBtns">
        <button id="btnB" type="button" aria-label="B button">B</button>
        <button id="btnA" type="button" aria-label="A button">A</button>
      </div>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
