<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Hope Starts Small — Chapter 1: Seeds</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="console">
    <div id="screen">
      <canvas id="game" width="160" height="144"></canvas>
      <a id="audibleBtn" href="https://www.audible.com/pd/Hope-Starts-Small-Audiobook/B0DZPCHT4M" target="_blank" rel="noopener" hidden>&#9834; LISTEN ON AUDIBLE</a>
    </div>
    <div id="deck" hidden>
      <div id="stickPad"><div id="stickBase"><div id="stickKnob"></div></div></div>
      <div id="touchBtns">
        <button id="btnB" type="button" aria-label="B button">B</button>
        <button id="btnA" type="button" aria-label="A button">A</button>
      </div>
    </div>
  </div>
  <p id="hint">Arrows / WASD move &middot; Z or Enter = A &middot; X or Esc = B &middot; P = menu &middot; gamepad &amp; touch supported &middot; full list in the in-game CONTROLS menu</p>
  <script src="game.js"></script>
